    <!--
      NOTA DE SEGURIDAD
      ─────────────────
      Esta página NO contiene ninguna credencial. Es solo un editor visual que
      corre en el navegador. Para guardar cambios pide iniciar sesión con
      GitHub: sin una cuenta con permiso de escritura sobre el repositorio,
      abrir esta URL no permite hacer absolutamente nada.

      La versión de Decap CMS está FIJADA (no se usa "latest") para que una
      actualización externa no pueda cambiar el código que corre acá sin que
      nosotros lo revisemos primero.

      IMPORTANTE: la etiqueta script tiene que ir al FINAL DEL CUERPO de la
      página, nunca en la cabecera. Decap se dibuja dentro del cuerpo al
      ejecutarse; si corre antes de que el cuerpo exista, la página queda en
      blanco y NO muestra ningún error (así se rompió la primera versión).
    -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
